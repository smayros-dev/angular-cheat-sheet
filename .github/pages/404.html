<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <script>
    // GitHub Pages serves only this root 404 page, so a reloaded app route such
    // as /<repo>/ng16/login lands here. Send it back to that app's start page.
    (function () {
      var parts = location.pathname.split('/');
      var i = parts.findIndex(function (p) { return /^ng\d+$/.test(p); });
      var target = i > 0 ? parts.slice(0, i + 1).join('/') + '/' : parts.slice(0, 2).join('/') + '/';
      location.replace(target);
    })();
  </script>
</head>
<body>
  <p>Redirecting…</p>
</body>
</html>
