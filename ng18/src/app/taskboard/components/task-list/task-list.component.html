@if (tasks.length > 0) {
  <ul class="task-list">
    @for (task of tasks; track task.id) {
      <li tbHighlight tabindex="0" class="task-item">
        <span class="title">{{ task.title }}</span>
        <span class="status">{{ task.status | status }}</span>
      </li>
    }
  </ul>
} @else {
  <p class="empty">No tasks yet</p>
}
