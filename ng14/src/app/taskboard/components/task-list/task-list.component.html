<ul *ngIf="tasks.length > 0; else empty" class="task-list">
  <li *ngFor="let task of tasks; trackBy: trackByTask" tbHighlight class="task-item">
    <span class="title">{{ task.title }}</span>
    <span class="status">{{ task.status | status }}</span>
  </li>
</ul>

<ng-template #empty>
  <p class="empty">No tasks yet</p>
</ng-template>
